name: trackstudy
description: A calm, local-first weekly execution tracker.
publish_to: none
version: 1.2.1+4
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqlite3: ^3.1.0
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  file_selector: ^1.0.3
  supabase_flutter: ^2.17.2
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
flutter:
  uses-material-design: true
